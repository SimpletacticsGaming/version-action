name: 'CalVer version generator'
description: |
  Computes a CalVer version from the commit's committer date in UTC.
  • On a protected branch: yyyy.m.dhhmmss (e.g. 2026.10.29143507)
  • Everywhere else: the same version with a -g<short-sha> prerelease suffix
author: 'mohjohfox <marcofuchs@mohjohfox.de>'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  protected_branches:
    description: |
      Branches that receive a bare release version, comma- or newline-separated.
      Glob patterns are supported, e.g. "main,release/*".
    required: false
    default: "main,master"
  tag_prefix:
    description: "Prefix for the `tag` output. Set to an empty string for bare tags."
    required: false
    default: "v"
  sha_length:
    description: "Number of short-sha characters in the prerelease suffix (4-40)."
    required: false
    default: "7"
  non_monotonic:
    description: |
      What to do when the computed version is older than the latest existing
      release tag: "warn" (default), "fail", or "ignore".
    required: false
    default: "warn"
  version:
    description: |
      Explicit version override. When set, the computed CalVer value is
      discarded and this string is used verbatim.
    required: false
    default: ""
  remote:
    description: "Git remote used for tag lookups and fetching missing commits."
    required: false
    default: "origin"

outputs:
  version:
    description: "The computed version, e.g. 2026.10.29143507 or 2026.10.29143507-g1a2b3c4."
    value: ${{ steps.version.outputs.version }}
  tag:
    description: "The version prefixed with `tag_prefix`, e.g. v2026.10.29143507."
    value: ${{ steps.version.outputs.tag }}
  is_prerelease:
    description: "'true' when the version carries a prerelease suffix."
    value: ${{ steps.version.outputs.is_prerelease }}
  is_protected:
    description: "'true' when the branch matches `protected_branches`."
    value: ${{ steps.version.outputs.is_protected }}
  tag_exists:
    description: "'true' when `tag` already exists on the remote at this exact commit."
    value: ${{ steps.version.outputs.tag_exists }}
  commit_sha:
    description: "Full sha of the commit the version was derived from."
    value: ${{ steps.version.outputs.commit_sha }}
  short_sha:
    description: "Truncated sha used in the prerelease suffix."
    value: ${{ steps.version.outputs.short_sha }}
  commit_date:
    description: "Committer date of that commit, ISO-8601 in UTC."
    value: ${{ steps.version.outputs.commit_date }}
  branch:
    description: "Branch the version was computed for."
    value: ${{ steps.version.outputs.branch }}

runs:
  using: 'composite'
  steps:
    - name: Compute version
      id: version
      shell: bash
      env:
        INPUT_PROTECTED_BRANCHES: ${{ inputs.protected_branches }}
        INPUT_TAG_PREFIX: ${{ inputs.tag_prefix }}
        INPUT_SHA_LENGTH: ${{ inputs.sha_length }}
        INPUT_NON_MONOTONIC: ${{ inputs.non_monotonic }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REMOTE: ${{ inputs.remote }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/compute-version.sh" >> "$GITHUB_OUTPUT"
