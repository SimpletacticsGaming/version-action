name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck --severity=style scripts/*.sh tests/*.sh

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Lint the commits this PR adds
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The merge base is computed here rather than taken from
          # pull_request.base.sha, which goes stale as soon as the base branch moves.
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          npx commitlint --from "$base" --to HEAD --verbose

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash tests/compute-version.test.sh

  self-test:
    name: Self test (${{ github.event_name }})
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required, not merely preferred: semantic-release analyses
      # history back to the last tag, and the mirror the action builds from a shallow
      # clone is itself shallow, which would silently yield the wrong version.
      #
      # The dev channel refuses to run on a detached HEAD, and a pull_request build
      # checks out the merge ref detached. Check out the PR's head branch instead --
      # that is the mode the action documents and consumers actually use. Both
      # expressions are empty on a push build, where checkout's defaults already
      # leave HEAD attached to the branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - id: version
        uses: ./

      - name: Assert the dev version is well formed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base_version }}
          TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          echo "version=$VERSION base=$BASE tag=$TAG"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-g[0-9a-f]{7}$ ]] \
            || fail "'$VERSION' is not X.Y.Z-g<sha>"
          [[ "$TAG" == "v$VERSION" ]] || fail "tag '$TAG' is not 'v$VERSION'"
          [[ "$VERSION" == "${BASE}-g${SHORT_SHA}" ]] \
            || fail "'$VERSION' is not '$BASE' plus '-g$SHORT_SHA'"
          [[ "$IS_PRERELEASE" == "true" ]] || fail "a dev build must be a prerelease"

      - name: Assert the version is reproducible
        id: again
        uses: ./

      - name: Compare both runs
        env:
          FIRST: ${{ steps.version.outputs.version }}
          SECOND: ${{ steps.again.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$FIRST" == "$SECOND" ]] \
            || { echo "::error::version is not deterministic: '$FIRST' then '$SECOND'"; exit 1; }
          echo "Both runs produced $FIRST"

  release:
    name: Release
    # Only a direct push to main releases, and only once every check is green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shellcheck, test, self-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      # Queue rather than cancel: a cancelled run could leave the tag pushed and the
      # release missing.
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
